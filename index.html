    <noscript>
      <style>
        @font-face {
          font-family: Inter;
          font-style: normal;
          font-weight: 300 900;
          font-display: swap;
          src: url('/fonts/inter-latin.woff2') format('woff2');
        }
        * {
          box-sizing: border-box;
        }
        body {
          margin: 0;
          background: #eef0f4;
          color: #0a0a0a;
          font-family: Inter, Arial, sans-serif;
          line-height: 1.6;
        }
        .noscript-hero {
          padding: 72px 24px;
          background: #066fee;
          color: #fff;
        }
        .noscript-wrap {
          max-width: 1080px;
          margin: 0 auto;
        }
        .noscript-hero h1 {
          margin: 0;
          color: #fff;
          font-size: clamp(47px, 8vw, 136px);
          font-weight: 900;
          line-height: 0.88;
          letter-spacing: -0.035em;
          text-transform: uppercase;
        }
        .noscript-hero h1 span {
          display: block;
        }
        .noscript-hero .noscript-statement {
          max-width: 680px;
          font-size: 32px;
          font-weight: 800;
          line-height: 1.1;
        }
        .noscript-hero p {
          max-width: 720px;
          margin: 24px 0 0;
          font-size: 18px;
        }
        .noscript-content {
          padding: 64px 24px;
        }
        .noscript-content h2 {
          max-width: 760px;
          margin: 0 auto 34px;
          font-size: 34px;
          line-height: 1.1;
        }
        .noscript-grid {
          display: grid;
          max-width: 1080px;
          grid-template-columns: repeat(3, minmax(0, 1fr));
          gap: 16px;
          margin: 0 auto;
        }
        .noscript-unit {
          padding: 26px;
          border: 1px solid #dcdfe3;
          border-radius: 8px;
          background: #fff;
        }
        .noscript-unit h3 {
          margin: 34px 0 0;
          font-size: 26px;
        }
        .noscript-unit p {
          color: #555;
        }
        .noscript-unit a,
        .noscript-legal a {
          display: inline-flex;
          min-height: 44px;
          align-items: center;
          color: #066fee;
          font-weight: 800;
        }
        .noscript-contact {
          padding: 64px 24px;
          background: #066fee;
          color: #fff;
        }
        .noscript-contact > div {
          max-width: 1080px;
          margin: 0 auto;
        }
        .noscript-contact h2 {
          max-width: 760px;
          margin: 0;
          font-size: 34px;
          line-height: 1.1;
        }
        .noscript-contact p {
          max-width: 720px;
          margin: 20px 0 26px;
        }
        .noscript-contact a {
          display: inline-flex;
          min-height: 48px;
          align-items: center;
          padding: 12px 22px;
          border-radius: 999px;
          background: #fff;
          color: #066fee;
          font-weight: 800;
          text-decoration: none;
        }
        .noscript-legal {
          max-width: 1080px;
          margin: 0 auto;
          padding: 0 24px 72px;
        }
        @media (max-width: 760px) {
          .noscript-hero h1 {
            font-size: 44px;
          }
        }
        @media (max-width: 400px) {
          .noscript-hero h1 {
            font-size: 40px;
          }
        }
        @media (max-width: 380px) {
          .noscript-hero h1 {
            font-size: 39px;
          }
          .noscript-hero .noscript-statement {
            font-size: 27px;
          }
          .noscript-grid {
            grid-template-columns: 1fr;
          }
        }
      </style>
      <main>

            </p>

            <article class="noscript-unit">

              <a href="/forge">Conocer Forge</a>
            </article>
            <article class="noscript-unit">
              <h3>Blue Sky Prospect</h3>

            </article>

              <p>Iniciativa futura orientada a explorar nuevas oportunidades digitales.</p>
              <a href="/commerce">Conocer la visión</a>
            </article>
          </div>
        </section>

          <div>

            <p>

            </p>
            <a href="/contacto">Realizar una consulta</a>

            Forge recibe consultas y evalúa posibles proyectos. Prospect continúa en desarrollo y
            Commerce permanece como iniciativa futura. La formalización de cualquier proyecto está
            sujeta a evaluación, acuerdos específicos y documentación aplicable.
          </p>
          <a href="/estado-y-alcance">Leer Compliance</a>
          <span> · </span>
          <a href="/privacidad">Privacidad</a>
          <span> · </span>
          <a href="/terminos">Términos</a>
        </section>

    </noscript>
